[project]
name = "netbox-compare"
version = "0.1.0"
description = "NetBox plugin that detects drift between NetBox and live network devices"
readme = "README.md"
requires-python = ">=3.12"
# NetBox itself is not a pip dependency: the plugin is installed into NetBox's venv.
dependencies = ["netbox-compare-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_compare"]
