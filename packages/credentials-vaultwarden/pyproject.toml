[project]
name = "netbox-compare-vaultwarden"
version = "0.1.0"
description = "netbox-compare credentials module backed by Vaultwarden/Bitwarden"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "netbox-compare-core",
    "requests>=2.31",
    "cryptography>=42",
    "argon2-cffi>=23",
]

[project.entry-points."netbox_compare.credentials"]
vaultwarden = "netbox_compare_vaultwarden.provider:VaultwardenProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_compare_vaultwarden"]
