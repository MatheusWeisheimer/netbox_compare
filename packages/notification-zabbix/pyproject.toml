[project]
name = "netbox-compare-zabbix"
version = "0.1.0"
description = "netbox-compare notification module: sends scheduled run results to Zabbix"
requires-python = ">=3.12"
dependencies = [
    "netbox-compare-core",
    "requests>=2.31",
]

[project.entry-points."netbox_compare.notifications"]
zabbix = "netbox_compare_zabbix.module:ZabbixNotifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_compare_zabbix"]
