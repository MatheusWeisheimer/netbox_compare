[project]
name = "netbox-compare-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "netbox-compare-core",
    "netbox-compare-vaultwarden",
    "netbox-compare-napalm",
    "netbox-compare-zabbix",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/credentials-vaultwarden",
    "packages/connection-napalm",
    "packages/notification-zabbix",
]

[tool.uv.sources]
netbox-compare-core = { workspace = true }
netbox-compare-vaultwarden = { workspace = true }
netbox-compare-napalm = { workspace = true }
netbox-compare-zabbix = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
addopts = "-m 'not live' --import-mode=importlib"
pythonpath = [
    "packages/credentials-vaultwarden/tests",
    "packages/notification-zabbix/tests",
    "packages/plugin/src",
]
markers = ["live: needs a running Vaultwarden or Zabbix and their NBC_* env vars"]
testpaths = [
    "packages/core/tests",
    "packages/credentials-vaultwarden/tests",
    "packages/connection-napalm/tests",
    "packages/notification-zabbix/tests",
    "packages/plugin/tests",
]

[tool.ruff.lint.isort]
known-first-party = [
    "netbox_compare",
    "netbox_compare_core",
    "netbox_compare_napalm",
    "netbox_compare_vaultwarden",
    "netbox_compare_zabbix",
    "vaultfixtures",
    "zbxreports",
]
